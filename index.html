<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>proton — Browser Desktop</title>
<meta name="description" content="proton is a static, browser-only desktop cloned and rebranded from Mixt (proton-arcade/mlp). Create an account on first launch — everything is saved on this device.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23111111'/%3E%3Ccircle cx='50' cy='50' r='10' fill='white'/%3E%3Cellipse cx='50' cy='50' rx='34' ry='13' fill='none' stroke='white' stroke-width='5'/%3E%3Cellipse cx='50' cy='50' rx='34' ry='13' fill='none' stroke='white' stroke-width='5' transform='rotate(60 50 50)'/%3E%3Cellipse cx='50' cy='50' rx='34' ry='13' fill='none' stroke='white' stroke-width='5' transform='rotate(120 50 50)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
<!-- apps: one HTML file per app (apps/<name>/app.html), loaded in this order -->
<link rel="proton-app" href="apps/files/app.html">
<link rel="proton-app" href="apps/notes/app.html">
<link rel="proton-app" href="apps/calendar/app.html">
<link rel="proton-app" href="apps/contacts/app.html">
<link rel="proton-app" href="apps/websites/app.html">
<link rel="proton-app" href="apps/app-center/app.html">
<link rel="proton-app" href="apps/customize/app.html">
<link rel="proton-app" href="apps/settings/app.html">
<link rel="proton-app" href="apps/about/app.html">
<link rel="proton-app" href="apps/calculator/app.html">
<link rel="proton-app" href="apps/spreadsheet/app.html">
<link rel="proton-app" href="apps/presentation/app.html">
<link rel="proton-app" href="apps/whiteboard/app.html">
<link rel="proton-app" href="apps/terminal/app.html">
<link rel="proton-app" href="apps/browser/app.html">
<link rel="proton-app" href="apps/media/app.html">
<link rel="proton-app" href="apps/pdf-viewer/app.html">
<link rel="proton-app" href="apps/sudoku/app.html">
<link rel="proton-app" href="apps/chess/app.html">
<link rel="proton-app" href="apps/checkers/app.html">
<link rel="proton-app" href="apps/klondike/app.html">

<link rel="proton-app" href="apps/speed-test/app.html">
<link rel="proton-app" href="apps/storage-test/app.html">
<!-- built-in websites: one HTML page per site (websites/<name>/site.html) -->
<link rel="proton-site" href="websites/guide/site.html">
<link rel="proton-site" href="websites/world-history/site.html">
<link rel="proton-site" href="websites/maths-resources/site.html">
<link rel="proton-site" href="websites/test-page/site.html">
<link rel="proton-site" href="websites/proton-daily/site.html">
</head>
<body>
<noscript><div class="noscript">proton needs JavaScript — it is a full desktop that runs entirely in your browser.</div></noscript>

<!-- Boot splash -->
<div id="boot" class="boot">
  <div class="boot-logo"><svg viewBox="0 0 100 100" width="52" height="52" aria-hidden="true"><circle cx="50" cy="50" r="9" fill="#000"/><g fill="none" stroke="#000" stroke-width="5"><ellipse cx="50" cy="50" rx="36" ry="14"/><ellipse cx="50" cy="50" rx="36" ry="14" transform="rotate(60 50 50)"/><ellipse cx="50" cy="50" rx="36" ry="14" transform="rotate(120 50 50)"/></g></svg></div>
  <div class="boot-name">proton</div>
  <div class="boot-sub">Your browser desktop</div>
  <div class="boot-bar"><i></i></div>
</div>

<!-- Auth (first-launch setup / login / lock) is rendered here -->
<main id="auth" class="auth-wrap" hidden></main>

<!-- Desktop is rendered here -->
<div id="desktop" class="desktop" hidden></div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<!-- core (infrastructure only — apps & websites are the HTML files
     listed in <head>, fetched at boot by assets/html-loader.js) -->
<script src="assets/store.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/core.js"></script>
<script src="assets/html-loader.js"></script>
<!-- boot: must load last -->
<script src="assets/boot.js"></script>
</body>
</html>
