<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>proton — Browser Desktop</title>
<meta name="description" content="proton is a static, browser-only desktop cloned and rebranded from Mixt (proton-arcade/mlp). Create an account on first launch — everything is saved on this device.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2368b723'/%3E%3Ccircle cx='50' cy='50' r='10' fill='white'/%3E%3Cellipse cx='50' cy='50' rx='34' ry='13' fill='none' stroke='white' stroke-width='5'/%3E%3Cellipse cx='50' cy='50' rx='34' ry='13' fill='none' stroke='white' stroke-width='5' transform='rotate(60 50 50)'/%3E%3Cellipse cx='50' cy='50' rx='34' ry='13' fill='none' stroke='white' stroke-width='5' transform='rotate(120 50 50)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<noscript><div class="noscript">proton needs JavaScript — it is a full desktop that runs entirely in your browser.</div></noscript>

<!-- Boot splash -->
<div id="boot" class="boot">
  <div class="boot-logo">⚛</div>
  <div class="boot-name">proton</div>
  <div class="boot-sub">Your browser desktop</div>
  <div class="boot-bar"><i></i></div>
</div>

<!-- Auth (first-launch setup / login / lock) is rendered here -->
<main id="auth" class="auth-wrap" hidden></main>

<!-- Desktop is rendered here -->
<div id="desktop" class="desktop" hidden></div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="assets/store.js"></script>
<script src="assets/core.js"></script>
<script src="assets/apps.js"></script>
<script src="assets/games.js"></script>
</body>
</html>
