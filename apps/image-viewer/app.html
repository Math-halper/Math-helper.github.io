<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Image Viewer - proton app</title></head>
<body>
<p>Launch Image Viewer from <a href="../../index.html">proton</a>.</p>
<script data-proton-app>
'use strict';
registerApp({
  render(body, ctx) {
    body.innerHTML = `${bar('Image Viewer', `<button class="btn sm" id="iv-open">${iconSvg('folder-open')} Open path…</button><button class="btn sm" id="iv-download" disabled>${iconSvg('download')} Download</button>`)}
      <div class="appbar muted" id="iv-name" style="background:#101010">No image open</div>
      <div class="file-viewer-stage" id="iv-stage"><p class="muted">Double-click an image in Files to view it here.</p></div>`;
    const stage = body.querySelector('#iv-stage');
    let path = null, blobUrl = null, token = 0;
    function release() { if (blobUrl) URL.revokeObjectURL(blobUrl); blobUrl = null; }
    async function open(p) {
      const st = FS.stat(p);
      if (!st || st.type !== 'file' || FS.appFor(st.path) !== 'image-viewer') {
        MH.toast('Choose an image file from Files.'); return;
      }
      const thisLoad = ++token;
      release(); path = st.path;
      body.querySelector('#iv-name').textContent = `${st.path} · ${MH.fmtBytes(st.size)}`;
      body.querySelector('#iv-download').disabled = false;
      stage.innerHTML = '<span class="muted">Loading image…</span>';
      try {
        const url = st.user ? URL.createObjectURL(await FS.readBlob(st.path))
          : new URL(st.path.slice(1), document.baseURI).href;
        if (thisLoad !== token) { if (st.user) URL.revokeObjectURL(url); return; }
        if (st.user) blobUrl = url;
        const img = document.createElement('img');
        img.alt = st.name; img.src = url;
        img.onerror = () => { stage.textContent = 'This browser could not display the image. Try Download.'; };
        stage.replaceChildren(img);
      } catch (err) { if (thisLoad === token) stage.textContent = 'Could not open image: ' + err.message; }
    }
    body.querySelector('#iv-open').onclick = () => {
      const p = prompt('Path to an image:', path || FS.home() + '/Pictures/');
      if (p?.trim()) open(FS.normalize(p.trim(), FS.home()));
    };
    body.querySelector('#iv-download').onclick = async () => {
      if (!path) return;
      try { MH.download(FS.basename(path), await FS.readBlob(path), FS.mime(path)); }
      catch (err) { MH.toast(err.message); }
    };
    body.openPath = ({ path: p }) => { if (p) open(p); };
    body.onDestroy = () => { token++; release(); };
    if (ctx.path) open(ctx.path);
  },
});
</script>
</body>
</html>
