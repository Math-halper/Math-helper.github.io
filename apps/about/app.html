<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About - proton app</title>
</head>
<body>
<p>This file is a proton app. It is not meant to be opened on its own:
open <a href="../../index.html">proton</a> and launch <b>About</b> from the
proton menu. The script below is fetched and run by proton's HTML loader
(assets/html-loader.js) at boot.</p>
<!-- proton app: everything that registers and renders this app lives in
     this one script block. Edit it, then reload proton. -->
<script data-proton-app>
/* proton app module: about — edit this file to change this app.
 * Loaded by index.html; calls registerApp() (see apps/README.md). */
'use strict';

/* ============================ ABOUT ============================ */
registerApp({
  /* Metadata (name, icon, cat, desc, w, h) lives in the app catalog:
   * data/applications.js — edit it there, not here. */
  render(body) {
    body.innerHTML = `${bar('About proton')}<div class="app-main pad">
      <div style="display:flex;gap:14px;align-items:center"><div class="auth-logo">${iconSvg('atom')}</div><div><h2 style="margin:0">proton</h2><span class="muted">A complete desktop computer in your browser — no server edition</span></div></div>
      <p>This site is a <b>static clone</b> of <b>Mixt</b> from <a href="https://github.com/proton-arcade/mlp/tree/arena/170861f7-mlp" target="_blank" rel="noopener">proton-arcade/mlp @ arena/170861f7-mlp</a> (commit <span class="kbd">c37c6ca</span>), the Mint/Cinnamon-styled browser desktop built on Puter-derived internals. The original needs a Node.js server, SQLite and HTTPS; GitHub Pages can only serve static files, so the desktop, window manager and apps were <b>rebuilt browser-only</b> and rebranded, keeping Mixt's panel layout (the original's green accent has been replaced here by a black-and-white palette).</p>
      <h3>Your account</h3>
      <p>On first launch you created an account that lives <b>only in this browser</b> (localStorage). Passwords are salted SHA-256 hashes — never plain text, never sent anywhere. Refreshing the page signs you out and asks for your password again, just like signing out; every app saves per-account, automatically.</p>
      <h3>What's inside</h3>
      <p>${Object.values(APPS).map((a) => `${iconFor(a.icon)} ${MH.esc(a.name)}`).join(' · ')}</p>
      <p class="muted">This build ships its <b>System apps only</b> — the productivity, media, create and arcade-game apps that proton used to bundle have all been removed. Apps are catalog entries, so each one can be added back with a folder under <span class="kbd">apps/</span> and one block in <span class="kbd">data/applications.js</span>.</p>
      <h3>Credits &amp; licence</h3>
      <p class="muted">Mixt / this clone: GNU AGPL-3.0-only. Contains design and app concepts derived from Puter (© Puter Technologies Inc., AGPL-3.0). Not affiliated with Linux Mint, Cinnamon, Puter, or the original authors. Full notes in <span class="kbd">CREDITS.md</span> and <span class="kbd">LICENSE.txt</span> in this repository.</p>
      <button class="btn primary" onclick="window.open('https://github.com/proton-arcade/mlp/tree/arena/170861f7-mlp','_blank')">${iconSvg('external')} View the original project</button>
    </div>`;
  },
});
</script>
</body>
</html>
