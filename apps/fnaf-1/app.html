<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Nights at Freddy's - proton app</title>
</head>
<body>
<p>This file is a proton app. It is not meant to be opened on its own:
open <a href="../../index.html">proton</a> and launch <b>Five Nights at Freddy's</b> from the
proton menu. The script below is fetched and run by proton's HTML loader
(assets/html-loader.js) at boot.</p>
<!-- proton app module: fnaf-1 — a streamed arcade game. The build is NOT in this
     repository: assets/game-host.js frames it live from Proton Arcade
     (https://proton-arcade.github.io), and this module only says which build to
     frame and how big a first load is. Edit assets/game-host.js to change the
     window every game shares; edit data/applications.js for this game's name,
     icon, category, description and window size. See CREDITS.md for where each
     title comes from. -->
<script data-proton-app>
'use strict';
registerApp({
  render(body, ctx) {
    PROTON_ARCADE.open(body, ctx, {
      src: 'website/games/Five-nights-at-Freddys/one/index.html',
      size: '19 MB',
    });
  },
});
</script>
</body>
</html>
