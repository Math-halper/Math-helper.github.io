<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storage Test - proton app</title>
</head>
<body>
<p>This file is a proton app. It is not meant to be opened on its own:
open <a href="../../index.html">proton</a> and launch <b>Storage Test</b> from the
proton menu. The script below is fetched and run by proton's HTML loader
(assets/html-loader.js) at boot.</p>
<!-- proton app: everything that registers and renders this app lives in
     this one script block. Edit it, then reload proton. -->
<script data-proton-app>
/* proton TEST app: Storage Test — checks this browser can actually save
 * proton accounts/data, and shows how much space this account uses. */
'use strict';

registerApp({
  id: 'storage-test', name: 'Storage Test', icon: 'database', cat: 'Test', desc: 'TEST APP: verify saving works & see this account’s storage use', w: 620, h: 480,
  render(body) {
    body.innerHTML = `${bar('Storage Test')}<div class="app-main pad">
      <div class="stat-grid">
        <div class="stat"><b id="sg-account">…</b><span class="muted">saved for this account</span></div>
        <div class="stat"><b id="sg-total">…</b><span class="muted">total proton data in this browser</span></div>
        <div class="stat"><b id="sg-accounts">…</b><span class="muted">accounts on this device</span></div>
      </div>
      <div class="card" style="margin-top:12px"><h3 style="margin-top:0">Write / read test</h3>
        <p class="muted">Writes a scratch value to this browser's storage, reads it back, and deletes it. If this passes, accounts, notes, apps and customisations can save.</p>
        <button class="btn primary" id="sg-run">Run storage test</button>
        <p id="sg-out" style="min-height:1.5em"></p></div>
      <div class="card" style="margin-top:12px"><b>Breakdown (this account)</b><div id="sg-break" class="muted" style="margin-top:6px"></div></div></div>`;
    function stats() {
      const mine = JSON.stringify(userData).length;
      let total = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('mhOS.')) total += k.length + (localStorage.getItem(k) || '').length;
      }
      body.querySelector('#sg-account').textContent = MH.fmtBytes(mine);
      body.querySelector('#sg-total').textContent = MH.fmtBytes(total);
      body.querySelector('#sg-accounts').textContent = Object.keys(MH.accounts()).length;
      const counts = [
        ['Notes', userData.notes.length], ['Files', userData.files.length],
        ['Events', userData.events.length], ['Custom apps', (userData.customApps || []).length],
        ['Websites', (userData.websites || []).length], ['Themes', (userData.customThemes || []).length],
        ['Wallpapers', (userData.customWallpapers || []).length], ['Module edits', Object.keys(userData.moduleOverrides || {}).length],
      ];
      body.querySelector('#sg-break').innerHTML = counts.map(([n, c]) => `${n}: <b style="color:#fff">${c}</b>`).join(' · ');
    }
    stats();
    body.querySelector('#sg-run').onclick = () => {
      const out = body.querySelector('#sg-out'), key = 'mhOS.storage-test', probe = 'proton-' + Date.now();
      try {
        localStorage.setItem(key, probe);
        const back = localStorage.getItem(key);
        localStorage.removeItem(key);
        out.innerHTML = back === probe && localStorage.getItem(key) === null
          ? '<b>Storage works</b> — wrote, read back and cleaned up successfully.'
          : '<b>Storage warning:</b> returned unexpected data. Saving may be unreliable in this browser.';
      } catch (err) {
        out.innerHTML = `<b>Storage failed:</b> ${MH.esc(err.message)} — this browser may be in private mode or out of space.`;
      }
      stats();
    };
  },
});
</script>
</body>
</html>
