<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Text Editor - proton app</title></head>
<body>
<p>Launch Text Editor from <a href="../../index.html">proton</a>.</p>
<script data-proton-app>
'use strict';
/* Plain-text editor for real files in the shared virtual file system. Notes
 * is a separate rich-text notebook; editing a .txt/.js/.md file must never
 * create a note or silently change the file from a preview pane. */
registerApp({
  render(body, ctx) {
    body.innerHTML = `${bar('Text Editor', `<button class="btn sm" id="te-open">${iconSvg('folder-open')} Open path…</button><button class="btn sm" id="te-new">${iconSvg('plus')} New file</button><button class="btn sm primary" id="te-save">${iconSvg('save')} Save</button><button class="btn sm" id="te-download">${iconSvg('download')} Download</button>`)}
      <div class="appbar" style="background:#101010"><span id="te-path" class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">No file open</span><span id="te-status" class="muted"></span></div>
      <textarea class="file-editor-text" id="te-text" aria-label="File contents" spellcheck="false" disabled placeholder="Open a text file from Files, or create a new one here."></textarea>`;
    const text = body.querySelector('#te-text');
    const status = body.querySelector('#te-status');
    const saveBtn = body.querySelector('#te-save');
    let path = null, readonly = false, dirty = false, loading = 0;
    function update() {
      body.querySelector('#te-path').textContent = path || 'No file open';
      status.textContent = !path ? '' : readonly ? 'Read-only system file' : dirty ? 'Unsaved changes' : 'Saved';
      saveBtn.disabled = !path || readonly || !dirty;
      body.querySelector('#te-download').disabled = !path;
    }
    function canLeave() { return !dirty || confirmBox('Discard unsaved changes to this file?'); }
    async function open(pathToOpen, confirmed = false) {
      const st = FS.stat(pathToOpen);
      if (!st || st.type !== 'file') { MH.toast('File not found.'); return false; }
      if (FS.isBinary(st.path)) { MH.toast('This is a binary file — open it with its associated app.'); return false; }
      if (!confirmed && st.path !== path && !canLeave()) return false;
      if (st.path === path) { text.focus(); return true; }
      const token = ++loading;
      text.disabled = true;
      status.textContent = 'Loading…';
      try {
        const contents = await FS.read(st.path);
        if (token !== loading) return false;
        path = st.path; readonly = st.readonly; dirty = false;
        text.value = contents; text.disabled = false; text.readOnly = readonly;
        update(); text.focus(); return true;
      } catch (err) {
        if (token === loading) { text.disabled = !path; update(); MH.toast(`Could not open file: ${err.message}`); }
        return false;
      }
    }
    function save() {
      if (!path || readonly) return false;
      if (!FS.stat(path)) { MH.toast('The file was moved or deleted. Save it under a new path.'); return false; }
      try {
        FS.write(path, text.value); dirty = false; update(); return true;
      } catch (err) { MH.toast(err.message); return false; }
    }
    text.addEventListener('input', () => { dirty = true; update(); });
    text.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
      if (e.key === 'Tab' && !text.readOnly) {
        e.preventDefault(); const a = text.selectionStart, b = text.selectionEnd;
        text.setRangeText('  ', a, b, 'end'); dirty = true; update();
      }
    });
    body.querySelector('#te-save').onclick = save;
    body.querySelector('#te-open').onclick = () => {
      const target = prompt('Path to a text file:', path || FS.home() + '/Documents/Welcome.txt');
      if (target?.trim()) open(FS.normalize(target.trim(), FS.home()));
    };
    body.querySelector('#te-new').onclick = () => {
      if (!canLeave()) return;
      const target = prompt('New file path (under your home folder):', FS.home() + '/Documents/Untitled.txt');
      if (!target?.trim()) return;
      const p = FS.normalize(target.trim(), FS.home());
      if (FS.exists(p)) { MH.toast('A file with that name already exists.'); return; }
      try { FS.write(p, ''); open(p, true); }
      catch (err) { MH.toast(err.message); }
    };
    body.querySelector('#te-download').onclick = async () => {
      if (!path) return;
      try { MH.download(FS.basename(path), await FS.readBlob(path), FS.mime(path)); }
      catch (err) { MH.toast(err.message); }
    };
    body.openPath = ({ path: p }) => { if (p) open(p); };
    body.beforeClose = canLeave;
    update();
    if (ctx.path) open(ctx.path);
  },
});
</script>
</body>
</html>
