<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Websites - proton app</title>
</head>
<body>
<p>This file is a proton app. It is not meant to be opened on its own:
open <a href="../../index.html">proton</a> and launch <b>Websites</b> from the
proton menu. The script below is fetched and run by proton's HTML loader
(assets/html-loader.js) at boot.</p>
<!-- proton app: everything that registers and renders this app lives in
     this one script block. Edit it, then reload proton. -->
<script data-proton-app>
/* proton app module: websites — edit this file to change this app.
 * Loaded by index.html; calls registerApp() (see apps/README.md). */
'use strict';

/* ============================ WEBSITES ============================ */
registerApp({
  id: 'websites', name: 'Websites', icon: 'globe', cat: 'Productivity', desc: 'Websites already saved on this account — open or remove them (adding is disabled)', w: 900, h: 580,
  render(body) {
    body.innerHTML = `${bar('Websites')}<div class="app-main pad">
    <div class="card"><h3 style="margin-top:0">Adding websites is disabled</h3>
      <p class="muted">Everything on proton is part of the static website. Websites already saved on this account are listed below and can be opened or removed. To visit a new address without saving it, type it in the Browser address bar.</p></div>
    <h3>Your websites <span class="muted" id="ws-count"></span></h3>
    <div class="grid-cards" id="ws-list"></div></div>`;
    function draw() {
      body.querySelector('#ws-count').textContent = `(${userData.websites.length})`;
      body.querySelector('#ws-list').innerHTML = userData.websites.length ? userData.websites.map((s) => `
        <div class="card"><div class="card-ic" style="font-size:28px">${iconFor(s.icon, 'globe')}</div>
        <h3 style="margin:6px 0 3px">${MH.esc(s.name)}</h3>
        <p class="muted site-url" style="min-height:32px">${MH.esc(s.url)}</p>
        <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm primary" data-open="${s.id}">Open</button>
        <button class="btn sm" data-remove="${s.id}">Remove</button></div></div>`).join('')
        : '<p class="muted">No saved websites on this account.</p>';
      body.querySelectorAll('[data-open]').forEach((b) => b.onclick = () => { const s = userData.websites.find((x) => x.id === b.dataset.open); if (s) openWebsite(s); });

      body.querySelectorAll('[data-remove]').forEach((b) => b.onclick = () => {
        const s = userData.websites.find((x) => x.id === b.dataset.remove);
        if (s && confirmBox(`Remove the website “${s.name}”? (Any app made from it stays.)`)) {
          userData.websites = userData.websites.filter((x) => x.id !== s.id); saveData(); draw(); MH.toast('Website removed.');
        }
      });
    }
    draw();
  },
});
</script>
</body>
</html>
