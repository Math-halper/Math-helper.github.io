<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My App - proton app</title>
</head>
<body>
<p>This file is a proton app. It is not meant to be opened on its own:
open <a href="../../index.html">proton</a> and launch <b>My App</b> from the
proton menu. The script below is fetched and run by proton's HTML loader
(assets/html-loader.js) at boot.</p>
<!-- proton app: this script block is the app's code (render). Its metadata
     (name, icon, category, size) comes from the catalog, data/applications.js. -->
<script data-proton-app>
/* TEMPLATE — copy this whole _template folder, rename it, then add ONE
 * [application] block to data/applications.js (copy the template in that
 * file's header comment):
 *
 *   [application]
 *   id=my-app
 *   name=My App
 *   path=apps/my-app/app.html
 *   icon=grid
 *   svg-icon=true
 *   cat=Productivity
 *   desc=What this app does
 *   w=720
 *   h=480
 *
 * proton's HTML loader (assets/html-loader.js) reads the catalog at boot,
 * fetches this file, and runs the script block below. Delete this comment
 * when you're done. This _template file itself is never loaded. */
'use strict';

registerApp({
  /* Metadata (name, icon, cat, desc, w, h) lives in the app catalog:
   * data/applications.js — edit it there, not here. */
  render(body) {
    // body is your window. userData is the signed-in account's saved data.
    body.innerHTML = `${bar('My App')}<div class="app-main pad">
      <p>Hello from my app!</p>
      <button class="btn primary" id="my-btn">Click me</button>
    </div>`;
    body.querySelector('#my-btn').onclick = () => {
      MH.toast('It works!');
      // saveData(); // after changing userData
    };
  },
});
</script>
</body>
</html>
