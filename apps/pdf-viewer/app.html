<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>PDF Viewer - proton app</title></head>
<body>
<p>Launch PDF Viewer from <a href="../../index.html">proton</a>.</p>
<script data-proton-app>
'use strict';
registerApp({
  render(body, ctx) {
    body.innerHTML = `${bar('PDF Viewer', `<label class="btn sm primary" style="margin:0">${iconSvg('folder-open')} Open from computer<input id="pdf-file" type="file" accept="application/pdf,.pdf" hidden></label><span class="muted" id="pdf-name"></span>`)}
      <div class="app-main" id="pdf-main"><div class="pad muted" style="text-align:center;padding-top:60px">${iconSvg('file-text')}<br><b>No PDF open</b><br>Double-click a PDF in Files, or choose one from this computer. Nothing is uploaded.</div></div>`;
    const main = body.querySelector('#pdf-main');
    let objectUrl = null, token = 0;
    function release() { if (objectUrl) URL.revokeObjectURL(objectUrl); objectUrl = null; }
    function show(blob, name) {
      release();
      objectUrl = URL.createObjectURL(blob);
      body.querySelector('#pdf-name').textContent = name;
      main.innerHTML = `<iframe title="PDF: ${MH.esc(name)}" style="width:100%;height:100%;border:0;min-height:420px" src="${MH.esc(objectUrl)}"></iframe>`;
    }
    async function open(path) {
      const st = FS.stat(path);
      if (!st || st.type !== 'file' || FS.extname(st.path) !== 'pdf') { MH.toast('Choose a PDF file from Files.'); return; }
      const thisLoad = ++token;
      main.innerHTML = '<div class="pad muted">Loading PDF…</div>';
      try {
        const blob = await FS.readBlob(st.path);
        if (thisLoad === token) show(blob, st.name);
      } catch (err) { if (thisLoad === token) main.textContent = 'Could not open PDF: ' + err.message; }
    }
    body.querySelector('#pdf-file').onchange = (e) => {
      const file = e.target.files[0]; e.target.value = '';
      if (file) { token++; show(file, file.name); }
    };
    body.openPath = ({ path }) => { if (path) open(path); };
    body.onDestroy = () => { token++; release(); };
    if (ctx.path) open(ctx.path);
  },
});
</script>
</body>
</html>
