<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Logic Sim — web edition</title>
<meta name="description" content="Design and simulate digital logic circuits in the browser — a web edition of Sebastian Lague's Digital Logic Sim.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230a0a0a'/%3E%3Cpath d='M13 3 5.4 13.4c-.3.4 0 .9.5.9h4.4l-1 6.1c-.1.6.6 1 1 .5l6.3-9.3c.3-.4 0-.9-.5-.9h-4.2l1.4-6.3c.1-.6-.6-.9-1-.4z' fill='%23fff'/%3E%3C/svg%3E">
<!-- This site is listed in the website catalog, data/websites.js — its
     id, name, icon and description live there, not in this file. -->
<link rel="stylesheet" href="logic-sim.css">
<style>
  html, body { height: 100%; margin: 0; background: #424245; }
  #ls-root { height: 100vh; height: 100dvh; }
  noscript div { color: #fff; padding: 30px; font: 15px system-ui, sans-serif; }
</style>
</head>
<body>
<div id="ls-root"></div>
<noscript><div>Digital Logic Sim needs JavaScript to run.</div></noscript>
<!-- one JS file per concern (translated from upstream Unity C#), in load order:
     theme → simulation core → UI chrome → interaction → renderer → editor kernel
     → entry point (assembles window.LogicSim) -->
<script src="js/theme.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/interaction.js"></script>
<script src="js/renderer.js"></script>
<script src="js/editor.js"></script>
<script src="logic-sim.js"></script>
<script>
  window.LogicSim.mount(document.getElementById('ls-root'), { source: 'site' });
</script>
</body>
</html>
